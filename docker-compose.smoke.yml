# Used only together with docker-compose.yml by scripts/smoke.py.
# Each run gets its own project, volumes, container names and ephemeral host ports.
services:
  order-api:
    image: sre-observability-platform-order-api:smoke
    container_name: !reset null
    ports: !override ["127.0.0.1::8000"]
  payment-worker:
    image: sre-observability-platform-payment-worker:smoke
    container_name: !reset null
    ports: !override ["127.0.0.1::8001"]
  prometheus:
    ports: !override ["127.0.0.1::9090"]
  jaeger:
    ports: !override ["127.0.0.1::16686"]
  loki:
    ports: !override ["127.0.0.1::3100"]
  grafana:
    ports: !override ["127.0.0.1::3000"]
  alertmanager:
    ports: !override ["127.0.0.1::9093"]
  alert-webhook:
    image: sre-observability-platform-alert-webhook:smoke
    ports: !override ["127.0.0.1::8080"]
