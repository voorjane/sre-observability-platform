services:
  order-api:
    build:
      context: ./services/order-api
      dockerfile: Dockerfile
    container_name: order-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PAYMENT_WORKER_URL=http://payment-worker:8001
    depends_on:
      - payment-worker
    networks:
      - sre-net

  payment-worker:
    build:
      context: ./services/payment-worker
      dockerfile: Dockerfile
    container_name: payment-worker
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    networks:
      - sre-net

  prometheus:
    image: prom/prometheus:v3.13.5
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-35d}
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      - order-api
      - payment-worker
    networks:
      - sre-net

volumes:
  prometheus-data:

networks:
  sre-net:
    driver: bridge
