services:
  order-api:
    build:
      context: ./services/order-api
      dockerfile: Dockerfile
    container_name: order-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PAYMENT_WORKER_URL=http://payment-worker:8001
      - PAYMENT_TIMEOUT=${PAYMENT_TIMEOUT:-5s}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_TIMEOUT=${OTEL_EXPORTER_OTLP_TIMEOUT:-1000}
      - OTEL_EXPORTER_OTLP_TRACES_TIMEOUT=${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:-}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
    depends_on:
      - payment-worker
    networks:
      - sre-net

  payment-worker:
    build:
      context: ./services/payment-worker
      dockerfile: Dockerfile
    container_name: payment-worker
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - PROCESS_DELAY=${PROCESS_DELAY:-20ms}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_TIMEOUT=${OTEL_EXPORTER_OTLP_TIMEOUT:-1000}
      - OTEL_EXPORTER_OTLP_TRACES_TIMEOUT=${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:-}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
    networks:
      - sre-net

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4318:4318"
    networks:
      - sre-net

  prometheus:
    image: prom/prometheus:v3.13.5
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-35d}
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      - order-api
      - payment-worker
    networks:
      - sre-net

  loki:
    image: grafana/loki:3.7.10
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki-data:/loki
    networks:
      - sre-net

  log-collector:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./monitoring/log-collector:/etc/alloy:ro
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - order-api
      - payment-worker
    networks:
      - sre-net

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      # Jaeger 2.23 exposes service/operation discovery through its v3 HTTP API.
      GF_FEATURE_TOGGLES_ENABLE: jaegerEnableGrpcEndpoint
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - sre-net

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:

networks:
  sre-net:
    driver: bridge
