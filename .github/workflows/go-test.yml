name: main pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'services/**'
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - 'docker-compose.smoke.yml'
      - 'scripts/**'
      - 'monitoring/**'
      - 'Makefile'
      - '.env.example'
  pull_request:
    branches:
      - main
    paths:
      - 'services/**'
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - 'docker-compose.smoke.yml'
      - 'scripts/**'
      - 'monitoring/**'
      - 'Makefile'
      - '.env.example'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Validate observability configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.smoke.yml config --quiet

      - name: Validate Prometheus configuration and test recording rules
        run: make check-prometheus

      - name: Validate Loki and Alloy configuration
        run: make check-logs

      - name: Validate Grafana dashboards and test SLO display semantics
        run: make check-grafana

  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: false
          cache: false

      - name: Check code formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l services/)
          if [ -n "$UNFORMATTED" ]; then
            echo "::ERROR::Files not formatted according to gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run vet, tests and build for all services
        run: |
          echo "### Test & Coverage Summary" >> "$GITHUB_STEP_SUMMARY"

          for dir in services/*/; do
            if [ -f "${dir}go.mod" ]; then
              service_name=$(basename "$dir")
              echo "=== Testing $service_name ==="

              (cd "$dir" && go vet ./...)
              (cd "$dir" && go test -v -race -coverprofile=coverage.out -covermode=atomic ./...)
              (cd "$dir" && go build -v -ldflags="-s -w" -o /dev/null ./cmd/...)

              {
                echo "#### Service: \`$service_name\`"
                echo '```text'
                (cd "$dir" && go tool cover -func=coverage.out)
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Save coverage profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: services/*/coverage.out
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: Build & smoke observability stack
    needs: [test, config]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run isolated smoke test
        run: make smoke

      - name: Save smoke evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-evidence
          path: artifacts/smoke/
          if-no-files-found: warn
          retention-days: 7
