global:
  resolve_timeout: 5m
route:
  receiver: local-webhook
  group_by:
  - service
  - slo
  - profile
  - alertname
  - severity
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 15m
inhibit_rules:
- source_matchers:
  - severity="critical"
  target_matchers:
  - severity="warning"
  equal:
  - service
  - slo
  - profile
receivers:
- name: local-webhook
  webhook_configs:
  - url: http://alert-webhook:8080/alerts
    send_resolved: true
    max_alerts: 50
