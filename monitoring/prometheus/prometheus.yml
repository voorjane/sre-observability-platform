global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: order-api
    metrics_path: /metrics
    static_configs:
      - targets: ["order-api:8000"]

  - job_name: payment-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-worker:8001"]
