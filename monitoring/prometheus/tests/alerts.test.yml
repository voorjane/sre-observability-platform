# S4 production policy. Ratio/readiness inputs are outputs of S3-02, tested separately.
rule_files:
- ../rules/alerts.yml
evaluation_interval: 1m
fuzzy_compare: true
group_eval_order:
- order-burn-rate
- availability-alerts
- telemetry-alerts
tests:
- name: healthy traffic
  interval: 1m
  external_labels:
    dashboard_base_url: http://localhost:3000
    runbook_base_url: http://localhost:8085/runbooks
  input_series:
  - series: up{job="order-api",instance="a"}
    values: 1+0x20
  - series: up{job="payment-worker",instance="b"}
    values: 1+0x20
  - series: order:slo_error_ratio:ratio{service="order-api",method="POST",handler="/api/v1/orders",window="5m"}
    values: 0+0x20
  - series: order:slo_error_ratio:observed{service="order-api",method="POST",handler="/api/v1/orders",window="5m"}
    values: 0+0x20
  - series: order:slo_requests:increase{service="order-api",method="POST",handler="/api/v1/orders",window="5m"}
    values: 1000+0x20
  - series: order:slo_window_ready:bool{service="order-api",method="POST",handler="/api/v1/orders",window="5m"}
    values: 1+0x20
  - series: order:slo_error_ratio:ratio{service="order-api",method="POST",handler="/api/v1/orders",window="30m"}
    values: 0+0x20
  - series: order:slo_error_ratio:observed{service="order-api",method="POST",handler="/api/v1/orders",window="30m"}
    values: 0+0x20
  - series: order:slo_requests:increase{service="order-api",method="POST",handler="/api/v1/orders",window="30m"}
    values: 1000+0x20
  - series: order:slo_window_ready:bool{service="order-api",method="POST",handler="/api/v1/orders",window="30m"}
    values: 1+0x20
  - series: order:slo_error_ratio:ratio{service="order-api",method="POST",handler="/api/v1/orders",window="1h"}
    values: 0+0x20
  - series: order:slo_error_ratio:observed{service="order-api",method="POST",handler="/api/v1/orders",window="1h"}
    values: 0+0x20
  - series: order:slo_requests:increase{service="order-api",method="POST",handler="/api/v1/orders",window="1h"}
    values: 1000+0x20
  - series: order:slo_window_ready:bool{service="order-api",method="POST",handler="/api/v1/orders",window="1h"}
    values: 1+0x20
  - series: order:slo_error_ratio:ratio{service="order-api",method="POST",handler="/api/v1/orders",window="6h"}
    values: 0+0x20
  - series: order:slo_error_ratio:observed{service="order-api",method="POST",handler="/api/v1/orders",window="6h"}
