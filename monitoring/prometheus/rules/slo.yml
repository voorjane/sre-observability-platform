        * (min(min_over_time(up{job="order-api"}[1h])) == bool 1)
        * (min(count_over_time(up{job="order-api"}[1h])) >= bool 240)
        * (min(present_over_time(up{job="order-api"}[1m] offset 1h)) == bool 1)
      ) or vector(0)
    labels:
      window: 1h
  - record: order:slo_error_ratio:ratio
    expr: |-
      order:slo_error_ratio:observed{window="1h"}
      and (order:slo_window_ready:bool{window="1h"} == 1)
    labels:
      window: 1h
  - record: order:slo_availability:ratio
    expr: |-
      1 - order:slo_error_ratio:ratio{window="1h"}
    labels:
      window: 1h
  - record: order:slo_requests:increase
    expr: |-
      sum(increase(http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code!~"4.."}[6h]))
    labels:
      window: 6h
  - record: order:slo_errors:increase
    expr: |-
      sum(increase(http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code=~"5.."}[6h]))
      or (0 * sum(order:slo_requests:increase{window="6h"}))
    labels:
      window: 6h
  - record: order:slo_error_ratio:observed
    expr: |-
      (order:slo_errors:increase{window="6h"} / order:slo_requests:increase{window="6h"})
      and (order:slo_requests:increase{window="6h"} > 0)
      unless on() (count(count_over_time(
        http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code!~"4.."}[6h]
      ) < 2) > 0)
    labels:
      window: 6h
  - record: order:slo_scrape_coverage:ratio
    expr: |-
      (min(count_over_time(up{job="order-api"}[6h])) / 1440)
      or vector(0)
    labels:
      window: 6h
  - record: order:slo_window_ready:bool
    expr: |-
      (
        (min(up{job="order-api"}) == bool 1)
        * (max(time() - timestamp(up{job="order-api"})) <= bool 30)
        * (min(min_over_time(up{job="order-api"}[6h])) == bool 1)
        * (min(count_over_time(up{job="order-api"}[6h])) >= bool 1440)
        * (min(present_over_time(up{job="order-api"}[1m] offset 6h)) == bool 1)
      ) or vector(0)
    labels:
      window: 6h
  - record: order:slo_error_ratio:ratio
    expr: |-
      order:slo_error_ratio:observed{window="6h"}
      and (order:slo_window_ready:bool{window="6h"} == 1)
    labels:
      window: 6h
  - record: order:slo_availability:ratio
    expr: |-
      1 - order:slo_error_ratio:ratio{window="6h"}
    labels:
      window: 6h
  - record: order:slo_requests:increase
    expr: |-
      sum(increase(http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code!~"4.."}[30d]))
    labels:
      window: 30d
  - record: order:slo_errors:increase
    expr: |-
      sum(increase(http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code=~"5.."}[30d]))
      or (0 * sum(order:slo_requests:increase{window="30d"}))
    labels:
