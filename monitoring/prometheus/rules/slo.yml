# SLO: docs/slo.md. All windows use only completed order-api requests without 4xx.
# :observed records are provisional; :ratio / :quantile require a complete healthy window.
# Coverage assumes the configured 15s scrape interval. Changing it requires rule/test updates.
# No group interval override: promtool can simulate a month without 172800 rule evaluations.
groups:
- name: order-slo
  labels:
    service: order-api
    method: POST
    handler: /api/v1/orders
  rules:
  - record: order:slo_requests:increase
    expr: |-
      sum(increase(http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code!~"4.."}[5m]))
    labels:
      window: 5m
  - record: order:slo_errors:increase
    expr: |-
      sum(increase(http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code=~"5.."}[5m]))
      or (0 * sum(order:slo_requests:increase{window="5m"}))
    labels:
      window: 5m
  - record: order:slo_error_ratio:observed
    expr: |-
      (order:slo_errors:increase{window="5m"} / order:slo_requests:increase{window="5m"})
      and (order:slo_requests:increase{window="5m"} > 0)
      unless on() (count(count_over_time(
        http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code!~"4.."}[5m]
      ) < 2) > 0)
    labels:
      window: 5m
  - record: order:slo_scrape_coverage:ratio
    expr: |-
      (min(count_over_time(up{job="order-api"}[5m])) / 20)
      or vector(0)
    labels:
      window: 5m
  - record: order:slo_window_ready:bool
    expr: |-
      (
        (min(up{job="order-api"}) == bool 1)
        * (max(time() - timestamp(up{job="order-api"})) <= bool 30)
        * (min(min_over_time(up{job="order-api"}[5m])) == bool 1)
        * (min(count_over_time(up{job="order-api"}[5m])) >= bool 20)
        * (min(present_over_time(up{job="order-api"}[1m] offset 5m)) == bool 1)
      ) or vector(0)
    labels:
      window: 5m
  - record: order:slo_error_ratio:ratio
    expr: |-
      order:slo_error_ratio:observed{window="5m"}
      and (order:slo_window_ready:bool{window="5m"} == 1)
    labels:
      window: 5m
  - record: order:slo_availability:ratio
    expr: |-
      1 - order:slo_error_ratio:ratio{window="5m"}
    labels:
      window: 5m
  - record: order:slo_requests:increase
    expr: |-
      sum(increase(http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code!~"4.."}[30m]))
    labels:
      window: 30m
  - record: order:slo_errors:increase
    expr: |-
      sum(increase(http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code=~"5.."}[30m]))
      or (0 * sum(order:slo_requests:increase{window="30m"}))
    labels:
      window: 30m
  - record: order:slo_error_ratio:observed
    expr: |-
      (order:slo_errors:increase{window="30m"} / order:slo_requests:increase{window="30m"})
      and (order:slo_requests:increase{window="30m"} > 0)
      unless on() (count(count_over_time(
        http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code!~"4.."}[30m]
      ) < 2) > 0)
    labels:
      window: 30m
  - record: order:slo_scrape_coverage:ratio
    expr: |-
      (min(count_over_time(up{job="order-api"}[30m])) / 120)
      or vector(0)
    labels:
      window: 30m
  - record: order:slo_window_ready:bool
    expr: |-
      (
        (min(up{job="order-api"}) == bool 1)
        * (max(time() - timestamp(up{job="order-api"})) <= bool 30)
        * (min(min_over_time(up{job="order-api"}[30m])) == bool 1)
        * (min(count_over_time(up{job="order-api"}[30m])) >= bool 120)
        * (min(present_over_time(up{job="order-api"}[1m] offset 30m)) == bool 1)
      ) or vector(0)
    labels:
      window: 30m
  - record: order:slo_error_ratio:ratio
    expr: |-
      order:slo_error_ratio:observed{window="30m"}
      and (order:slo_window_ready:bool{window="30m"} == 1)
    labels:
      window: 30m
  - record: order:slo_availability:ratio
    expr: |-
      1 - order:slo_error_ratio:ratio{window="30m"}
    labels:
      window: 30m
  - record: order:slo_requests:increase
    expr: |-
      sum(increase(http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code!~"4.."}[1h]))
    labels:
      window: 1h
  - record: order:slo_errors:increase
    expr: |-
      sum(increase(http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code=~"5.."}[1h]))
      or (0 * sum(order:slo_requests:increase{window="1h"}))
    labels:
      window: 1h
  - record: order:slo_error_ratio:observed
    expr: |-
      (order:slo_errors:increase{window="1h"} / order:slo_requests:increase{window="1h"})
      and (order:slo_requests:increase{window="1h"} > 0)
      unless on() (count(count_over_time(
        http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code!~"4.."}[1h]
      ) < 2) > 0)
    labels:
      window: 1h
  - record: order:slo_scrape_coverage:ratio
    expr: |-
      (min(count_over_time(up{job="order-api"}[1h])) / 240)
      or vector(0)
    labels:
      window: 1h
  - record: order:slo_window_ready:bool
    expr: |-
      (
        (min(up{job="order-api"}) == bool 1)
