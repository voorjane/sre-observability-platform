  - record: order:slo_error_ratio:observed
    expr: |-
      (order:slo_errors:increase{window="30d"} / order:slo_requests:increase{window="30d"})
      and (order:slo_requests:increase{window="30d"} > 0)
      unless on() (count(count_over_time(
        http_requests_total{service="order-api", method="POST", handler="/api/v1/orders", status_code!~"4.."}[30d]
      ) < 2) > 0)
    labels:
      window: 30d
  - record: order:slo_scrape_coverage:ratio
    expr: |-
      (min(count_over_time(up{job="order-api"}[30d])) / 172800)
      or vector(0)
