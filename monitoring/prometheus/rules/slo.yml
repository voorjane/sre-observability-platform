  - record: order:slo_availability:observed
    expr: |-
      1 - order:slo_error_ratio:observed{window="5m"}
    labels:
      window: 5m
  - record: order:slo_latency_p95_seconds:observed
    expr: |-
      histogram_quantile(0.95,
        sum by (le) (increase(
          http_request_duration_seconds_bucket{service="order-api", method="POST", handler="/api/v1/orders", status_code!~"4.."}[5m]
        ))
      )
      and on() (sum(increase(
        http_request_duration_seconds_bucket{service="order-api", method="POST", handler="/api/v1/orders", status_code!~"4..", le="+Inf"}[5m]
      )) > 0)
      unless on() (count(count_over_time(
        http_request_duration_seconds_bucket{service="order-api", method="POST", handler="/api/v1/orders", status_code!~"4.."}[5m]
      ) < 2) > 0)
