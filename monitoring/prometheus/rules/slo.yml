  - record: order:slo_window_ready:bool
    expr: |-
      (
        (min(up{job="order-api"}) == bool 1)
        * (max(time() - timestamp(up{job="order-api"})) <= bool 30)
        * (min(min_over_time(up{job="order-api"}[30d])) == bool 1)
        * (min(count_over_time(up{job="order-api"}[30d])) >= bool 172800)
        * (min(present_over_time(up{job="order-api"}[1m] offset 30d)) == bool 1)
